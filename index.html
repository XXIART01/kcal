<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ккал">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Ккал — счётчик</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap" id="app" hidden>
  <div class="top">
    <button class="title" id="dateLbl"></button>
    <button class="icon-btn" id="settingsBtn" aria-label="Цели">⚙︎</button>
  </div>

  <div class="days">
    <button class="icon-btn sm" id="prev" aria-label="Предыдущая неделя">‹</button>
    <div class="days-row" id="week"></div>
    <button class="icon-btn sm" id="next" aria-label="Следующая неделя">›</button>
  </div>

  <section data-tab="today">
  <div class="card hero">
    <div class="hero-row">
      <div>
        <div class="cap" id="kLeftLbl">Осталось</div>
        <div class="big" id="kLeft">—</div>
        <div class="sub" id="eatenTxt"></div>
      </div>
      <div class="ring">
        <svg width="96" height="96" viewBox="0 0 96 96">
          <circle cx="48" cy="48" r="40" fill="none" stroke="var(--soft)" stroke-width="9"/>
          <circle id="ringArc" cx="48" cy="48" r="40" fill="none" stroke="var(--ink)" stroke-width="9" stroke-linecap="round" stroke-dasharray="251.33" stroke-dashoffset="251.33" style="transition:stroke-dashoffset .5s"/>
        </svg>
        <div class="mid" id="kPct"></div>
      </div>
    </div>
  </div>

  <div class="tiles" id="macros"></div>

  <div class="card row-card">
    <div><div class="cap">Вода</div><div class="w-num" id="wNum"></div></div>
    <form class="w-btns" id="wForm">
      <button class="round" type="button" id="wMinus" aria-label="Минус 250 мл">−</button>
      <input class="w-in" id="wIn" type="number" inputmode="numeric" min="1" max="5000" placeholder="250" aria-label="Сколько мл добавить">
      <button class="round add" type="submit" aria-label="Добавить воду">+</button>
    </form>
  </div>

  <div class="card meals-sum" id="mealSum"></div>
  </section>

  <section data-tab="sups" hidden>
  <h3 class="sec">Добавки</h3>
  <div class="card" id="supCard">
    <div class="cap" id="supInfo"></div>
    <div id="sups"></div>
  </div>

  </section>

  <section data-tab="food" hidden>
  <h3 class="sec">Еда <span id="itemsCount"></span><button class="round" id="addBtn2" aria-label="Добавить еду">+</button></h3>
  <div class="card" id="meals"></div>

  <div class="card" id="microCard">
    <div class="cap">Микроэлементы</div>
    <div class="micro" id="micro"></div>
  </div>

  </section>

  <div class="status" id="status"></div>
</div>

<nav class="tabbar" id="tabbar" hidden>
  <button class="on" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8"/></svg>Сегодня</button>
  <button data-tab="food"><svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 1-3 4-3 7h3v11"/></svg>Еда</button>
  <button data-tab="sups" id="supTab"><svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="6" rx="3" transform="rotate(-45 12 12)"/><path d="M9.2 9.2l5.6 5.6"/></svg>Добавки</button>
</nav>

<div class="wrap" id="setup" hidden>
  <div class="card" style="margin-top:30px">
    <h2 style="margin:0 0 10px">Первый запуск</h2>
    <p class="hint">Вставь токен GitHub (fine-grained, только репозиторий kcal-data, Contents: Read and write). Он хранится только в этом браузере.</p>
    <form id="tokForm">
      <label class="fld"><span>Токен</span><input id="tokInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
      <button class="btn" type="submit">Войти</button>
      <div class="status err" id="tokErr"></div>
    </form>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>

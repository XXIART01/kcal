<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ккал">
<meta name="theme-color" content="#111116">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Ккал — счётчик</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="ptr" id="ptr" aria-hidden="true"></div>
<div class="bg" aria-hidden="true"><i class="sheen"></i><i class="spots"></i></div>
<main class="scroller" id="scroller">
<div class="wrap" id="app" hidden>
  <div class="top">
    <button class="title" id="dateLbl"></button>
    <div class="top-btns">
      <button class="icon-btn" id="supBtn" aria-label="Добавки"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><rect x="4" y="9" width="16" height="6" rx="3" transform="rotate(-45 12 12)"/><path d="M9.2 9.2l5.6 5.6"/></svg><b class="badge" id="supBadge"></b></button>
      <button class="icon-btn" id="scanBtn" aria-label="Сканировать штрихкод"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 8v8M11 8v8M14 8v8M17 8v8"/></svg></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Цели"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </div>

  <div class="days">
    <button class="icon-btn sm" id="prev" aria-label="Предыдущий день"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="days-row" id="week"></div>
    <button class="icon-btn sm" id="next" aria-label="Следующий день"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>

  <section data-tab="today">
  <div class="card hero">
    <div class="hero-row">
      <div>
        <div class="cap" id="kLeftLbl">Осталось</div>
        <div class="big" id="kLeft">—</div>
        <div class="sub" id="eatenTxt"></div>
      </div>
      <div class="ring" id="ringBox" role="img">
        <svg width="96" height="96" viewBox="0 0 96 96">
          <circle cx="48" cy="48" r="40" fill="none" stroke="var(--soft)" stroke-width="9"/>
          <circle id="ringArc" cx="48" cy="48" r="40" fill="none" stroke="var(--ink)" stroke-width="9" stroke-linecap="round" stroke-dasharray="0 251.33"/>
          <circle id="ringOver" cx="48" cy="48" r="40" fill="none" stroke="var(--over)" stroke-width="9" stroke-linecap="round" stroke-dasharray="0 251.33"/>
        </svg>
        <div class="mid" id="kPct" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <div class="tiles" id="macros"></div>

  <div class="card row-card">
    <div><div class="cap">Вода</div><div class="w-num" id="wNum"></div></div>
    <form class="w-btns" id="wForm">
      <button class="round" type="button" id="wMinus" aria-label="Убрать последнюю порцию воды"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <input class="w-in" id="wIn" type="number" inputmode="numeric" min="1" max="5000" placeholder="мл" aria-label="Сколько мл добавить">
      <button class="round" type="submit" aria-label="Добавить воду"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </form>
  </div>

  <div class="card meals-sum" id="mealSum"></div>
  </section>

  <section data-tab="sups" hidden>
  <h3 class="sec">Добавки</h3>
  <div class="card" id="supCard">
    <div class="cap" id="supInfo"></div>
    <div id="sups"></div>
  </div>

  </section>

  <section data-tab="food" hidden>
  <h3 class="sec">Мои продукты <button class="round" id="newFood" aria-label="Новый продукт"><svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></h3>
  <input class="search" id="foodQ" type="search" placeholder="Поиск в моих продуктах" autocomplete="off">
  <div class="hint lib-hint">Нажми на продукт, чтобы добавить его в приём пищи. Значения — на 100 г.</div>
  <div class="chips scroll" id="foodCats"></div>
  <div id="foodList"></div>
  </section>

  <div class="status" id="status"></div>
</div>
<div class="wrap" id="setup" hidden>
  <div class="card" style="margin-top:30px">
    <h2 style="margin:0 0 10px">Первый запуск</h2>
    <p class="hint">Вставь токен GitHub (fine-grained, только репозиторий kcal-data, Contents: Read and write). Он хранится только в этом браузере.</p>
    <form id="tokForm">
      <label class="fld"><span>Токен</span><input id="tokInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
      <button class="btn" type="submit">Войти</button>
      <div class="status err" id="tokErr"></div>
    </form>
  </div>
</div>
</main>

<nav class="tabbar" id="tabbar" hidden>
  <span class="tab-pill" id="tabPill" aria-hidden="true"></span>
  <button class="on" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8"/></svg>Сегодня</button>
  <button data-tab="food"><svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 1-3 4-3 7h3v11"/></svg>Продукты</button>
  <button data-tab="sups" id="supTab"><svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="6" rx="3" transform="rotate(-45 12 12)"/><path d="M9.2 9.2l5.6 5.6"/></svg>Добавки</button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
